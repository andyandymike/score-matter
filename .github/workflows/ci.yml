name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    name: M0 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit public tree before dependency installation
        run: python -X utf8 tools/audit_public_tree.py

      - name: Install package from a clean checkout
        run: python -m pip install --disable-pip-version-check .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run deterministic tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run end-to-end M0 smoke
        run: python -X utf8 tools/m0_smoke.py

      - name: Smoke installed CLI
        run: score-matter --help
