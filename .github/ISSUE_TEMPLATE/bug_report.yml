name: Bug report
description: Report a reproducible ScoreMatter defect.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private briefs, credentials, model weights, or unreviewed audio.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List exact commands using synthetic or shareable inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScoreMatter version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Paste sentinels, hashes, and redacted errors; do not upload restricted assets.
